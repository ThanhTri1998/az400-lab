# Reusable workflow: a whole set of JOBS, called with `uses:` at JOB level
name: l09-reusable-deploy
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      version:
        type: string
        required: true
    secrets:
      api-key:                 # caller passes it explicitly (or uses `secrets: inherit`)
        required: false
    outputs:
      deployed-url:
        description: 'Fake URL of the deployment'
        value: ${{ jobs.deploy.outputs.url }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}       # protection rules of this environment apply here
      url: https://example.invalid/${{ inputs.environment }}
    outputs:
      url: ${{ steps.fake.outputs.url }}
    steps:
    - id: fake
      run: |
        echo "Deploying ${{ inputs.version }} to ${{ inputs.environment }}"
        echo "APP_NAME (repo variable) = ${{ vars.APP_NAME }}"
        echo "DEPLOY_TARGET (environment variable) = ${{ vars.DEPLOY_TARGET }}"
        echo "secrets.api-key length      = ${#API_KEY}"
        echo "secrets.FAKE_API_KEY length = ${#FAKE}   (environment secret wins over repo secret)"
        echo "url=https://example.invalid/${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
      env:
        API_KEY: ${{ secrets.api-key }}
        FAKE: ${{ secrets.FAKE_API_KEY }}     # only resolvable when caller uses `secrets: inherit`
