# Bài 04: required status check cho ruleset trên l04/**. Chỉ chạy cho PR vào branch của bài 04.
name: l04-ci
on:
  pull_request:
    branches: ['l04/**', 'l04-release/**']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
