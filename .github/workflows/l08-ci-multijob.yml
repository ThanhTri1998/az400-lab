# L08 - GitHub Actions equivalent of the Azure Pipelines multistage.yml
name: l08-ci-multijob

on:
  workflow_dispatch:                 # manual "Run workflow" button / gh workflow run
    inputs:
      runContainerJob:
        type: boolean
        default: true
      failPackage:
        description: Make the package job fail (to see the notify job run)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:                         # one run per ref; a newer run cancels the older one
  group: l08-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with: { node-version: 20 }
    - run: for f in src/*.js; do node --check "$f" && echo "OK $f"; done

  unit-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        node: [ 20, 22 ]
    outputs:
      testedOn: ${{ steps.setvar.outputs.testedOn }}   # matrix: the value of the LAST leg to finish wins
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with: { node-version: '${{ matrix.node }}', cache: npm }
    - run: npm ci && npm test -- --ci
    - id: setvar
      run: echo "testedOn=$(node -v)" >> "$GITHUB_OUTPUT"

  container-test:
    if: ${{ inputs.runContainerJob }}
    runs-on: ubuntu-latest
    container: node:22               # steps run inside this container
    steps:
    - uses: actions/checkout@v4
    - run: node -v && npm ci && npx jest --ci

  package:
    needs: [ lint, unit-test ]        # like dependsOn
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: echo "Unit tests ran on ${{ needs.unit-test.outputs.testedOn }}"
    - if: ${{ inputs.failPackage }}
      run: exit 1
    - uses: actions/upload-artifact@v4
      with:
        name: app
        retention-days: 1            # keep lab artifacts short
        path: |
          src
          package.json
          package-lock.json

  deploy-dev:
    needs: package
    if: github.ref == 'refs/heads/main'   # implicit success() && ...
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with: { name: app }
    - run: ls -R | head -20

  notify:
    needs: [ lint, unit-test, package, deploy-dev ]
    if: failure()                     # like condition: failed()
    runs-on: ubuntu-latest
    steps:
    - run: echo "Something failed"
